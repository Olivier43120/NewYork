<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes carnets</title><style>body{margin:0;background:#0a1a2b;color:#fff;font:17px system-ui,sans-serif;padding:28px 18px}main{max-width:720px;margin:auto}a{display:flex;gap:14px;align-items:center;background:#12293d;border:1px solid #24465f;border-radius:18px;padding:12px;margin:12px 0;color:inherit;text-decoration:none}img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#234}small{color:#aebccb}</style></head><body><main><h1>Mes carnets de voyage</h1><div id="l"></div></main><script>const e=t=>String(t||'').replace(/</g,'&lt;');fetch('albums.json',{cache:'no-cache'}).then(r=>r.json()).then(a=>{l.innerHTML=a.map(x=>'<a href="'+encodeURI(x.dir)+'/"><img src="'+encodeURI(x.dir)+'/'+encodeURI(x.cover||'')+'" onerror="this.remove()"><div><b>'+e(x.title||x.dir)+'</b><br><small>'+e(x.subtitle||x.author)+'</small></div></a>').join('')||'Aucun carnet.'}).catch(()=>l.textContent='Aucun carnet.')</script></body></html>

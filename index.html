<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album de voyage : New York</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0a1a2b;--btn:#143042;--blue:#3d95e6;--ink:#fff;--mut:#b9c4cf;--side:440px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:var(--night)}
.leaflet-container{background:var(--night);font-family:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.35)!important;color:#aab!important;font-size:9px}
.leaflet-control-attribution a{color:#ccd!important}
/* pastilles photo */
.pin{width:48px;height:48px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#345;box-shadow:0 2px 8px #0008;transition:transform .25s}
.pin img{width:100%;height:100%;object-fit:cover;display:block}
.pin.on{transform:scale(1.25);border-color:var(--blue);box-shadow:0 0 0 6px #3d95e655,0 2px 10px #000a}
.plane{filter:drop-shadow(0 1px 3px #000c)}.plane div{width:26px;height:26px}.plane svg{display:block}
.pin.sm{width:38px;height:38px;border-width:2px}
/* en-tête & boutons */
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;pointer-events:none;z-index:500}
#top>*{pointer-events:auto}
.rb{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--btn);color:#fff;cursor:pointer;font-size:20px;box-shadow:0 2px 10px #0006}
#back{background:#fff;color:var(--night);visibility:hidden}
body.inview #back{visibility:visible}
#ttl{text-align:center;text-shadow:0 1px 8px #000}
#ttl small{display:block;font-size:13px;font-weight:500;opacity:.9}
#ttl b{font-size:24px;font-weight:600}
/* rail de steps */
#rail{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));height:200px;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50% - 130px);z-index:500;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 260px;border-radius:30px;overflow:hidden;scroll-snap-align:center;cursor:pointer;background:#234;border:2px solid transparent;transition:border-color .2s}
.card.on{border-color:#ffffff66}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card i{position:absolute;inset:0;background:linear-gradient(transparent 40%,#000b)}
.card div{position:absolute;left:18px;right:18px;bottom:14px}
.card b{display:block;font-size:21px;font-weight:600;line-height:1.15}
.card small{color:var(--mut);font-size:14px}
body.inview #rail{display:none}
/* visionneuse */
#viewer{position:fixed;left:0;right:0;bottom:0;top:240px;border-radius:30px 30px 0 0;overflow:hidden;background:#000;z-index:600;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);touch-action:none;user-select:none}
#viewer.on{transform:none}
#viewer>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0008,transparent 18%,transparent 55%,#000d)}
#prog{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:8px;z-index:2}
#prog i{flex:1;height:3px;border-radius:3px;background:#fff5;overflow:hidden}
#prog i.d:after{content:"";display:block;height:100%;background:#fff}
#cap{position:absolute;left:24px;right:24px;bottom:calc(30px + env(safe-area-inset-bottom));pointer-events:none}
#cap h2{font-size:30px;font-weight:600;line-height:1.1;text-shadow:0 2px 12px #000}
#cap p.m{margin:12px 0;font-size:15px;font-weight:500}
#cap .d p{margin:0 0 .6em}#cap .d b{font-weight:700}#cap .d{color:#e4e9ee;font-size:18px;line-height:1.6;max-width:60ch;padding-bottom:64px}
#act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:22px;align-items:center;background:#555d;backdrop-filter:blur(14px);padding:12px 24px;border-radius:30px;z-index:3;font-size:20px}
#act button{background:none;border:0;color:#fff;font:inherit;cursor:pointer}
/* barre latérale (ordinateur) */
#side{display:none}
@media(min-width:900px){
 #map{left:var(--side)}
 #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#0c2033;z-index:550;padding:26px 22px 0;overflow:hidden}
 #side h1{font-size:30px;font-weight:700}
 #side .by{color:var(--mut);margin:2px 0 18px}
 #stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
 #stats div{background:var(--btn);border-radius:16px;padding:12px 6px;text-align:center}
 #stats b{display:block;font-size:22px}#stats small{color:var(--mut);font-size:12px}
 #list{flex:1;overflow-y:auto;margin:0 -22px;padding:0 22px 22px;scrollbar-width:thin}
 .row{display:flex;gap:14px;align-items:center;padding:10px;border-radius:18px;cursor:pointer}
 .row:hover,.row.on{background:var(--btn)}
 .row img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #fff}
 .row b{display:block;font-weight:600}.row small{color:var(--mut)}
 #top{left:var(--side);width:calc(100% - var(--side))}
 #ttl{visibility:hidden}
 #viewer{top:0;bottom:0;right:auto;width:var(--side);border-radius:0}
 body.inview #side{visibility:hidden}
 #rail{left:var(--side);padding:0 calc(50% - 130px - var(--side)/2)}
 body.inview #map{left:var(--side)}
 #viewer{transform:translateX(-105%)}#viewer.on{transform:none}
}
#cover{position:fixed;inset:0;z-index:2000;background:#000;cursor:pointer;touch-action:none;transition:transform .85s cubic-bezier(.7,0,.2,1),opacity .85s}
#cover.out{transform:translateY(-100%);opacity:.5}
#cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cvs{position:absolute;inset:0;background:linear-gradient(#0006,transparent 25%,transparent 42%,#000d)}
#cvt{position:absolute;left:28px;right:28px;bottom:calc(48px + env(safe-area-inset-bottom));max-width:720px}
#cvt small{font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
#cvt h1{font-size:clamp(38px,9vw,72px);line-height:1.02;font-weight:700;text-shadow:0 2px 20px #000a;margin:6px 0 0}
#cvt p{font-size:19px;color:#e4e9ee;margin:10px 0 0}
#cvb{display:inline-block;margin-top:26px;padding:14px 26px;border-radius:30px;background:#fff;color:var(--night);font-weight:600;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}#cvb{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<aside id="side"><h1 id="h1"></h1><div class="by" id="by"></div><div id="stats"></div><div id="list"></div></aside>
<header id="top">
 <button class="rb" id="back" aria-label="Retour">&#8249;</button>
 <div id="ttl"><small id="who"></small><b id="place"></b></div>
 <button class="rb" id="lay" aria-label="Changer de fond de carte"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
</header>
<section id="rail"></section>
<section id="viewer">
 <img id="ph" alt="" draggable="false"><div id="shade"></div><div id="prog"></div>
 <div id="cap"><h2 id="t"></h2><p class="m" id="m"></p><div class="d" id="d"></div></div>
 <div id="act"><button id="prev">&#8249;</button><span id="cnt"></span><button id="next">&#8250;</button></div>
</section>
<section id="cover" hidden><img id="cv" alt=""><div id="cvs"></div>
 <div id="cvt"><small id="cva"></small><h1 id="cvh"></h1><p id="cvp"></p><span id="cvb">Ouvrir l’album &#8250;</span></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s), DESK=matchMedia('(min-width:900px)');
const SAT=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});
const PLAN=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const M=L.map('map',{zoomControl:false,center:[30,0],zoom:2,layers:[SAT]}), G=L.layerGroup().addTo(M);
let steps=[],cur=0,view=null,sat=true;
const fmt=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const md=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/gs,'<b>$1</b>').replace(/\*(?!\s)(.+?)\*/gs,'<i>$1</i>').split(/\n\s*\n/).filter(x=>x.trim()).map(x=>'<p>'+x.trim().replace(/\n/g,'<br>')+'</p>').join('');
const loc=p=>p.lat!=null?[p.lat,p.lng]:null;
const km=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const pad=()=>{const h=innerHeight;
 if(view)return DESK.matches?{paddingTopLeft:[60,90],paddingBottomRight:[60,60]}:{paddingTopLeft:[50,90],paddingBottomRight:[50,h-240+20]};
 return {paddingTopLeft:[60,100],paddingBottomRight:[60,DESK.matches?270:260]}};
const pin=(p,c)=>L.marker(loc(p),{icon:L.divIcon({className:'',iconSize:[48,48],html:`<div class="pin ${c}"><img src="${p.thumb||p.src}" alt=""></div>`})});
const dash=pts=>L.polyline(pts,{color:'#fff',weight:2.5,dashArray:'7 8',opacity:.9});

// Trajets : trait droit en dessous de FLIGHT_KM, sinon arc courbe + avions régulièrement espacés
const FLIGHT_KM=500,PLANE_EVERY=1800,PM=L.Projection.SphericalMercator;
const PLANE='<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 2c.8 0 1.5.7 1.5 1.5V9l8 5v2l-8-2.5V19l2 1.5V22l-3.5-1L8.5 22v-1.5l2-1.5v-5.5L2.5 16v-2l8-5V3.5C10.5 2.7 11.2 2 12 2z"/></svg>';
function route(pts,modes){const out=[];
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=[pts[i][0],pts[i][1]],d=km(a,b);
  const mo=modes&&modes[i];if(mo==='straight'||(mo!=='flight'&&d<FLIGHT_KM)){dash([a,b]).addTo(G);out.push(a,b);continue}
  if(Math.abs(b[1]-a[1])>180)b[1]+=b[1]<a[1]?360:-360;
  const P0=PM.project(L.latLng(a)),P1=PM.project(L.latLng(b)),dx=P1.x-P0.x,dy=P1.y-P0.y;
  let nx=-dy,ny=dx;if(ny<0){nx=-nx;ny=-ny}
  const C={x:(P0.x+P1.x)/2+nx*.28,y:(P0.y+P1.y)/2+ny*.28};
  const at=t=>L.point((1-t)**2*P0.x+2*(1-t)*t*C.x+t*t*P1.x,(1-t)**2*P0.y+2*(1-t)*t*C.y+t*t*P1.y);
  const arc=[];for(let k=0;k<=48;k++)arc.push(PM.unproject(at(k/48)));
  dash(arc).addTo(G);out.push(...arc);
  const n=Math.max(1,Math.round(d/PLANE_EVERY));
  for(let k=0;k<n;k++){const t=(k+.5)/n,A=at(Math.max(0,t-.01)),B=at(Math.min(1,t+.01)),rot=90-Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;
   L.marker(PM.unproject(at(t)),{interactive:false,keyboard:false,zIndexOffset:-500,icon:L.divIcon({className:'plane',iconSize:[26,26],iconAnchor:[13,13],html:`<div style="transform:rotate(${rot}deg)">${PLANE}</div>`})}).addTo(G)}
 }return out}

fetch('manifest.json').then(r=>r.json()).then(init).catch(()=>{$('#place').textContent='manifest.json introuvable'});

function init(m){
 steps=m.steps.filter(s=>s.photos.length);
 steps.forEach(s=>{let last=s.photos.find(loc);s.photos.forEach(p=>{if(p.lat==null&&last)[p.lat,p.lng]=last;else if(p.lat!=null)last=[p.lat,p.lng]});s.loc=s.photos.find(loc)&&loc(s.photos.find(loc))});
 document.title=m.title||'Album';$('#h1').textContent=$('#place').textContent=m.title||'Mon voyage';
 $('#by').textContent=m.author||'';$('#who').textContent=m.author||'';
 // statistiques
 const all=steps.flatMap(s=>s.photos),pts=all.filter(loc).map(loc);let d=0;for(let i=1;i<pts.length;i++)d+=km(pts[i-1],pts[i]);
 const days=new Set(all.map(p=>(p.date||'').slice(0,10)).filter(Boolean)).size;
 $('#stats').innerHTML=[[steps.length,'steps'],[all.length,'photos'],[Math.round(d).toLocaleString('fr-FR'),'km'],[days||'–','jours']].map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join('');
 $('#list').innerHTML=steps.map((s,i)=>`<div class="row" data-i="${i}"><img src="${s.photos[0].thumb||s.photos[0].src}" alt=""><div><b>${s.name}</b><small>${fmt(s.photos[0].date)} · ${s.photos.length} photos</small></div></div>`).join('');
 $('#rail').innerHTML=steps.map((s,i)=>`<article class="card" data-i="${i}"><img src="${s.photos[0].thumb||s.photos[0].src}" alt="" loading="lazy"><i></i><div><b>${s.name}</b><small>${fmt(s.photos[0].date)} · ${s.photos.length} photos</small></div></article>`).join('');
 $('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openStep(+r.dataset.i)};
 $('#rail').onclick=e=>{const c=e.target.closest('.card');if(c)openStep(+c.dataset.i)};
 let t;$('#rail').onscroll=()=>{clearTimeout(t);t=setTimeout(()=>{const r=$('#rail').getBoundingClientRect(),mid=r.left+r.width/2;let b=0,bd=1e9;
  document.querySelectorAll('.card').forEach((c,i)=>{const q=c.getBoundingClientRect(),dd=Math.abs(q.left+q.width/2-mid);if(dd<bd){bd=dd;b=i}});if(b!==cur)setActive(b,false)},90)};
 if(!openCover(m))setActive(0,false);
}
function openCover(m){
 if(!m.cover)return false;
 const C=$('#cover');let done=false,y0=0;
 $('#cv').src=m.cover.src;$('#cva').textContent=m.author||'';$('#cvh').textContent=m.title||'Mon voyage';$('#cvp').textContent=m.subtitle||'';
 C.hidden=false;
 const go=()=>{if(done)return;done=true;removeEventListener('keydown',k);C.classList.add('out');setTimeout(()=>{C.hidden=true},900);M.invalidateSize();setActive(0,false)};
 const k=e=>{if(['Enter',' ','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();go()}};
 addEventListener('keydown',k);C.onclick=go;
 C.addEventListener('pointerdown',e=>y0=e.clientY);C.addEventListener('pointerup',e=>{if(y0-e.clientY>40)go()});
 return true;
}
function homeMap(fit){
 G.clearLayers();const vs=steps.filter(s=>s.loc),pts=vs.map(s=>s.loc);
 route(pts,vs.map(s=>s.mode));
 steps.forEach((s,i)=>{if(!s.loc)return;pin(s.photos[0],i===cur?'on':'sm').on('click',()=>openStep(i)).addTo(G)});
 const s=steps[cur];if(fit&&s.loc)M.flyTo(s.loc,10,{duration:1.2});
}
function setActive(i,scroll){cur=i;
 document.querySelectorAll('.card,.row').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
 $('#place').textContent=steps[i].name;
 if(scroll)document.querySelector(`.card[data-i="${i}"]`).scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});
 homeMap(true);
}
function openStep(i,j=0){cur=i;view={i,j};document.body.classList.add('inview');$('#viewer').classList.add('on');
 const s=steps[i];$('#prog').innerHTML=s.photos.map(()=>'<i></i>').join('');
 G.clearLayers();const gp=s.photos.filter(loc),pts=gp.map(loc);
 const rp=route(pts,gp.map(p=>p.mode||s.mode));
 s.photos.forEach((p,k)=>{if(loc(p))pin(p,'sm').on('click',e=>{L.DomEvent.stop(e);show(k)}).addTo(G)});
 setTimeout(()=>{M.invalidateSize();if(pts.length)M.fitBounds(L.latLngBounds(pts.concat(rp)),{...pad(),maxZoom:17,duration:1})},60);
 show(j,true);
}
function show(j,first){
 const s=steps[view.i];
 j=Math.max(0,Math.min(j,s.photos.length-1));view.j=j;const p=s.photos[j];
 $('#ph').src=p.src;{const nx=s.photos[j+1];if(nx)new Image().src=nx.src}$('#t').textContent=s.name;
 $('#m').textContent=[fmt(p.date),p.lat==null?'':p.lat.toFixed(3)+'°, '+p.lng.toFixed(3)+'°'].filter(Boolean).join('  ·  ');
 $('#d').innerHTML=md(p.text||(j===0?s.desc:'')||'');
 $('#cnt').textContent=(j+1)+' / '+s.photos.length;
 [...$('#prog').children].forEach((e,k)=>e.className=k<=j?'d':'');
 G.eachLayer(l=>{if(l.getElement){const el=l.getElement().firstChild;el&&el.classList.toggle('on',l.getLatLng().equals(loc(p)))}});
 if(!first&&loc(p))M.fitBounds(L.latLngBounds([loc(p),loc(p)]),{...pad(),maxZoom:Math.max(M.getZoom(),15),duration:.8});
}
function closeView(){view=null;$('#viewer').style.transform='';document.body.classList.remove('inview');$('#viewer').classList.remove('on');setTimeout(()=>{M.invalidateSize();homeMap(true)},300)}
$('#back').onclick=closeView;
$('#prev').onclick=e=>{e.stopPropagation();view&&show(view.j-1)};
$('#next').onclick=e=>{e.stopPropagation();view&&show(view.j+1)};
$('#lay').onclick=()=>{sat=!sat;M.removeLayer(sat?PLAN:SAT);M.addLayer(sat?SAT:PLAN)};
addEventListener('keydown',e=>{if(!view)return;if(e.key==='ArrowRight')show(view.j+1);if(e.key==='ArrowLeft')show(view.j-1);if(e.key==='Escape')closeView()});
// glisser : côtés = photo suivante/précédente, vers le bas = fermer le step
let x0=null,y0=0,drag=false;const V=$('#viewer');
V.addEventListener('pointerdown',e=>{if(e.target.closest('#act'))return;x0=e.clientX;y0=e.clientY;drag=false});
V.addEventListener('pointermove',e=>{if(x0===null||DESK.matches)return;const dx=e.clientX-x0,dy=e.clientY-y0;
 if(dy>10&&dy>Math.abs(dx)){drag=true;V.style.transition='none';V.style.transform=`translateY(${dy}px)`}});
V.addEventListener('pointerup',e=>{if(x0===null||!view)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;V.style.transition='';
 if(drag){drag=false;if(dy>110)closeView();else V.style.transform='';return}
 if(dx<-50)show(view.j+1);else if(dx>50)show(view.j-1);
 else if(Math.abs(dx)<10&&Math.abs(dy)<10)show(e.clientX-V.getBoundingClientRect().left<V.clientWidth*.3?view.j-1:view.j+1)});
V.addEventListener('pointercancel',()=>{x0=null;drag=false;V.style.transition='';V.style.transform=''});
</script>
</body>
</html>

name: Générer le manifeste et les miniatures
on:
  push:
    branches: [main]
    paths-ignore: ['manifest.json', 'thumbs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm install --no-save exifr sharp
      - run: node tools/build-manifest.mjs .
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add manifest.json thumbs
          git diff --cached --quiet || (git commit -m "maj manifest et miniatures" && git push)
